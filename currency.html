<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversor de Divisas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header class="header">
        <div class="logo">
          <img src="/s-Photoroom.png" alt="logo" class="logo-img" />
        </div>
        <nav>
          <ul class="nav-links">
            <li><a href="index.html">Salary Calculator</a></li>
            <li><a href="currency.html" class="active">Currency Converter</a></li>
          </ul>
        </nav>
      </header>

      <div class="page-container">

        <!-- ── Converter Card ── -->
        <section class="converter-card">
          <h1 class="page-title">Conversor de Divisas</h1>

          <!-- FROM -->
          <div class="conv-field">
            <span class="conv-label">De</span>
            <div class="conv-row">
              <input
                type="number"
                id="amount"
                class="conv-amount"
                value="1"
                min="0"
                placeholder="0"
              />
              <select id="from-currency" class="conv-select"></select>
            </div>
          </div>

          <!-- Swap + Rate -->
          <div class="conv-middle">
            <button id="swap-btn" class="swap-btn" title="Intercambiar monedas">⇄</button>
            <span id="rate-info" class="rate-info"></span>
          </div>

          <!-- TO -->
          <div class="conv-field">
            <span class="conv-label">A</span>
            <div class="conv-row">
              <div id="result-amount" class="conv-result">—</div>
              <select id="to-currency" class="conv-select"></select>
            </div>
          </div>

          <!-- ARS blue market note -->
          <div id="ars-note" class="ars-note" style="display:none;"></div>

          <button id="convert-btn" class="calculate-btn">Convertir</button>
        </section>

        <!-- ── LATAM Grid ── -->
        <section class="latam-section">
          <h2 class="section-heading">América Latina</h2>
          <div id="latam-grid" class="latam-grid">
            <!-- populated by currency.js -->
          </div>
        </section>

      </div>
    </main>

    <script src="currency.js"></script>
  </body>
</html>
